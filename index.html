<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALI BOT X-1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050914;
  color:#eaf6ff;
  font-family:Tahoma,Arial,sans-serif;
}

header{
  text-align:center;
  padding:25px 12px;
  background:#081629;
  border-bottom:2px solid #00bfff;
  box-shadow:0 0 25px #008cff33;
}

header h1{
  color:#00c8ff;
  margin:0;
  text-shadow:0 0 15px #008cff;
}

header p{color:#a5bfd9}

.online{color:#42ffad;font-size:13px}

.container{
  width:100%;
  max-width:700px;
  margin:20px auto;
  padding:12px;
}

.clock{
  text-align:center;
  color:#00c8ff;
  font-size:22px;
  padding:15px;
}

.panel{
  background:#0a1425;
  border:1px solid #16436a;
  border-radius:18px;
  padding:15px;
  box-shadow:0 0 25px #007bff15;
}

#chat{
  height:350px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:5px;
  margin-bottom:15px;
}

.message{
  max-width:90%;
  padding:12px;
  border-radius:12px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.9;
}

.bot{
  align-self:flex-start;
  background:#10243b;
  border-right:3px solid #00bfff;
}

.user{
  align-self:flex-end;
  background:#073b66;
  border-right:3px solid #008cff;
}

.row{
  display:flex;
  gap:8px;
}

input{
  width:100%;
  min-width:0;
  background:#050b16;
  color:white;
  border:1px solid #17639c;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  outline:none;
}

button{
  background:#008cff;
  color:white;
  border:none;
  border-radius:10px;
  padding:12px;
  font-weight:bold;
  cursor:pointer;
}

.send{white-space:nowrap}

.tools{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-top:13px;
}

.tools button{
  background:#10243b;
  border:1px solid #087dbb;
}

.tools button:hover{background:#07538a}

footer{
  text-align:center;
  color:#7895b3;
  padding:20px;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ ALI BOT X-1 ⚡</h1>
  <p>دستیار دیجیتال اختصاصی علیرضا</p>
  <div class="online">● سیستم آماده است</div>
</header>

<div class="container">

  <div class="clock" id="clock">۰۰:۰۰:۰۰</div>

  <div class="panel">

    <div id="chat">
      <div class="message bot">
سلام قهرمان! 🤖💙

من ALI BOT X-1 هستم!

برای شروع، سلام کن یا یکی از دکمه‌های پایین رو بزن.
      </div>
    </div>

    <div class="row">
      <input id="input" placeholder="پیامت رو بنویس..." autocomplete="off">
      <button class="send" id="send">ارسال 🚀</button>
    </div>

    <div class="tools">
      <button onclick="quick('سلام')">👋 سلام</button>
      <button onclick="quick('جوک بگو')">😂 جوک</button>
      <button onclick="quick('بازی')">🎯 حدس عدد</button>
      <button onclick="quick('راهنما')">📚 راهنما</button>
      <button onclick="quick('ساعت')">🕒 ساعت</button>
      <button onclick="quick('حالت چطوره')">🤖 وضعیت بات</button>
      <button onclick="quick('اسم من علیرضا است')">👤 معرفی من</button>
      <button onclick="quick('حساب ۱۲+۸')">🧮 ماشین‌حساب</button>
      <button onclick="clearChat()">🧹 پاک کردن چت</button>
    </div>

  </div>
</div>

<footer>
ALI BOT X-1 • ساخته‌شده برای سرگرمی 💙
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let myName = "";

try {
  myName = localStorage.getItem("aliBotName") || "";
} catch(e) {}

let gameNumber = null;

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quick(text){
  input.value = text;
  sendMessage();
}

function clearChat(){
  chat.replaceChildren();
  addMessage("گفت‌وگو پاک شد! 💙 دوباره شروع کنیم؟","bot");
}

function randomItem(list){
  return list[Math.floor(Math.random()*list.length)];
}

function calculate(expression){
  expression = expression
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/,/g,".")
    .replace(/[×x]/g,"*")
    .replace(/÷/g,"/");

  if(!/^[\d+\-*/().%\s]+$/.test(expression)) return null;

  const tokens = expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g);

  if(!tokens || tokens.join("") !== expression.replace(/\s/g,""))
    return null;

  let pos = 0;

  function factor(){
    const t = tokens[pos++];

    if(t === "+") return factor();
    if(t === "-") return -factor();

    if(t === "("){
      const v = sum();
      if(tokens[pos++] !== ")") throw Error();
      return v;
    }

    if(!t || !/^\d+(?:\.\d+)?$/.test(t)) throw Error();

    return Number(t);
  }

  function term(){
    let v = factor();

    while(["*","/","%"].includes(tokens[pos])){
      const op = tokens[pos++];
      const b = factor();

      if((op === "/" || op === "%") && b === 0) throw Error();

      if(op === "*") v *= b;
      if(op === "/") v /= b;
      if(op === "%") v %= b;
    }

    return v;
  }

  function sum(){
    let v = term();

    while(tokens[pos] === "+" || tokens[pos] === "-"){
      const op = tokens[pos++];
      const b = term();
      v = op === "+" ? v+b : v-b;
    }

    return v;
  }

  try {
    const result = sum();

    if(pos !== tokens.length || !Number.isFinite(result)) return null;

    return Number(result.toFixed(8)).toString();
  } catch(e) {
    return null;
  }
}

function sendMessage(){
  const original = input.value.trim();

  if(!original) return;

  addMessage(original,"user");
  input.value = "";

  const msg = original
    .toLowerCase()
    .replace(/[؟?!،,]/g," ")
    .replace(/\s+/g," ")
    .trim();

  let reply = "";

  if(gameNumber !== null && /^\d+$/.test(msg)){
    const n = Number(msg);

    if(n < 1 || n > 10){
      reply = "یک عدد بین ۱ تا ۱۰ وارد کن! 🎯";
    } else if(n === gameNumber){
      reply = "آفرین قهرمان! درست حدس زدی! 🏆";
      gameNumber = null;
    } else {
      reply = n < gameNumber
        ? "عدد من بزرگ‌تره! دوباره امتحان کن 😎"
        : "عدد من کوچک‌تره! دوباره امتحان کن 😎";
    }
  }

  else if(msg.includes("اسم من") || msg.includes("من علیرضا")){
    myName = msg.includes("علیرضا") ? "علیرضا" :
      original.replace(/اسم من|است|هست/g,"").trim();

    try {
      localStorage.setItem("aliBotName",myName);
    } catch(e) {}

    reply = "خوشبختم " + myName + "! 💙";
  }

  else if(msg.includes("اسم تو") || msg.includes("اسمت چیه")){
    reply = "من ALI BOT X-1 هستم! 🤖⚡";
  }

  else if(msg === "سلام" || msg.startsWith("سلام ")){
    reply = randomItem([
      "سلام قهرمان! 😎💙",
      "سلااام! خوش اومدی! 🚀",
      "سلام رفیق! چه خبر؟ 🤖"
    ]);
  }

  else if(msg.includes("خوبی") || msg.includes("حالت چطوره")){
    reply = "من آماده‌ام باهات گپ بزنم! 💙 تو چطوری؟";
  }

  else if(msg.includes("جوک")){
    reply = randomItem([
      "به کامپیوتر گفتن چرا سردته؟ گفت ویندوزم بازه! 😂",
      "ربات رفت مدرسه؛ نمره‌اش شد صفر و یک! 🤖🤣",
      "چرا برنامه‌نویس گرسنه بود؟ چون دنبال باگ غذا می‌گشت! 😆",
      "معلم گفت چرا دیر اومدی؟ گفت ترافیک اینترنت بود! 😂"
    ]);
  }

  else if(msg.includes("بازی")){
    gameNumber = Math.floor(Math.random()*10)+1;
    reply = "🎯 یک عدد بین ۱ تا ۱۰ انتخاب کردم! حدس بزن چنده؟";
  }

  else if(msg.includes("ساعت")){
    reply = "ساعت الان: " + new Date().toLocaleTimeString("fa-IR");
  }

  else if(msg.includes("راهنما")){
    reply = "این‌ها رو امتحان کن:\nسلام\nجوک بگو\nبازی\nساعت\nاسم تو چیه\nحالت چطوره\nیا عبارت ریاضی مثل ۱۲+۸*۲";
  }

  else if(msg.includes("ممنون") || msg.includes("مرسی")){
    reply = "خواهش می‌کنم رفیق! 💙😎";
  }

  else if(msg.includes("خداحافظ") || msg.includes("فعلا")){
    reply = "فعلاً قهرمان! هر وقت خواستی برگرد! 🚀";
  }

  else {
    const expression = original
      .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
      .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/^حساب\s*/,"")
      .replace(/[×x]/g,"*")
      .replace(/÷/g,"/");

    const result = calculate(expression);

    if(result !== null && /[\d]/.test(expression)){
      reply = "جواب: " + result + " 🧮";
    } else {
      reply = randomItem([
        "جالبه! بیشتر برام توضیح می‌دی؟ 🤔",
        "هنوز جواب این جمله رو یاد نگرفتم! 🤖",
        "این یکی رو هنوز بلد نیستم؛ «راهنما» رو امتحان کن! 💙",
        "دارم پیشرفت می‌کنم! یه چیز دیگه بپرس 😎"
      ]);
    }
  }

  setTimeout(() => addMessage(reply,"bot"),200);
}

document.getElementById("send").addEventListener("click",sendMessage);

input.addEventListener("keydown",function(e){
  if(e.key === "Enter") sendMessage();
});

function updateClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("fa-IR");
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
